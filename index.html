<!DOCTYPE html>
<html lang="en">

<style>

<body>
<header>
  <div class="wrap">
    <h1>ifta-mileage-doctor</h1>
    <p>Turn trip miles, fuel purchases, and tax rates into an IFTA quarterly return.</p>
  </div>
</header>
<main>
  <div class="card">
    <label for="file">Trips JSON file <span class="hint">(or paste the trips JSON below)</span></label>
    <input type="file" id="file" accept=".json,application/json">
    <label for="input">Trips JSON (miles by state)</label>
    <textarea id="input" placeholder="Paste trips JSON here, or load the sample."></textarea>
    <label for="fuel">Fuel JSON (gallons by state)</label>
    <textarea id="fuel"></textarea>
    <label for="rates">Rates JSON (tax rate per gallon by state)</label>
    <textarea id="rates"></textarea>
    <div class="row">
      <div>
        <label for="quarter">Quarter label <span class="hint">(optional, CLI --quarter)</span></label>
        <input type="text" id="quarter" placeholder="2026-Q3">
      </div>
      <div>
        <label for="state">Show one state only <span class="hint">(optional, CLI --state)</span></label>
        <input type="text" id="state" placeholder="TX" maxlength="2">
      </div>
    </div>
    <div class="checkrow">
      <input type="checkbox" id="check"><label for="check">Run the --check gate</label>
      <input type="checkbox" id="json"><label for="json">JSON output (--json)</label>
    </div>
    <div class="buttons">
      <button id="run" type="button">Run</button>
      <button id="sample" type="button" class="secondary">Load sample</button>
      <button id="download" type="button">Download report</button>
    </div>
    <pre id="output">Your IFTA return will appear here.</pre>
  </div>
</main>
<footer>

  <p>Privacy: this tool runs 100% in your browser, nothing is uploaded.</p>

<script id="core">
"use strict";
/* Core logic: a faithful port of ifta_mileage_doctor.py.
   Pure functions only, no DOM access.
   window.runTool(inputText, options) -> report string.
   inputText is the trips JSON. options:
     fuelText  fuel purchases JSON text (the CLI --fuel file)
     ratesText rates JSON text (the CLI --rates file)
     quarter   quarter label string or "" (CLI --quarter)
     state     two letter state filter or "" (CLI --state)
     check     boolean (CLI --check)
     json      boolean (CLI --json)
*/

/* ---- Minimal Decimal with Python decimal semantics ----
   value = (neg ? -1 : 1) * coef * 10^exp, coef a non-negative BigInt.
   add/sub keep the smaller exponent, mul adds exponents, div follows
   the Python default context (28 significant digits, half even), and
   quantize supports ROUND_HALF_UP and ROUND_HALF_EVEN. */
function Dec(neg, coef, exp) { this.neg = neg; this.coef = coef; this.exp = exp; }
Dec.ZERO = new Dec(false, 0n, 0);
Dec.parse = function (text) {
  var s = String(text).trim().replace(/_/g, "");
  var neg = false;
  if (s.charAt(0) === "+") { s = s.slice(1); }
  else if (s.charAt(0) === "-") { neg = true; s = s.slice(1); }
  var expPart = 0;
  var ei = s.search(/[eE]/);
  if (ei >= 0) { expPart = parseInt(s.slice(ei + 1), 10); s = s.slice(0, ei); }
  var digits, exp;
  var di = s.indexOf(".");
  if (di >= 0) { digits = s.slice(0, di) + s.slice(di + 1); exp = expPart - (s.length - di - 1); }
  else { digits = s; exp = expPart; }
  digits = digits.replace(/^0+(?=\d)/, "");
  if (digits === "") { digits = "0"; }
  return new Dec(neg, BigInt(digits), exp);
};
Dec.isValidText = function (text) {
  return /^[+-]?(\d+(\.\d*)?|\.\d+)([eE][+-]?\d+)?$/.test(String(text).trim().replace(/_/g, ""));
};
Dec.prototype.clone = function () { return new Dec(this.neg, this.coef, this.exp); };
Dec.prototype.isZero = function () { return this.coef === 0n; };
Dec.prototype.negated = function () { return new Dec(!this.neg, this.coef, this.exp); };
Dec.prototype.cmp = function (other) {
  var s1 = this.isZero() ? 0 : (this.neg ? -1 : 1);
  var s2 = other.isZero() ? 0 : (other.neg ? -1 : 1);
  if (s1 !== s2) { return s1 < s2 ? -1 : 1; }
  if (s1 === 0) { return 0; }
  var e = Math.min(this.exp, other.exp);
  var c1 = this.coef * (10n ** BigInt(this.exp - e));
  var c2 = other.coef * (10n ** BigInt(other.exp - e));
  var c = c1 < c2 ? -1 : (c1 > c2 ? 1 : 0);
  return s1 === 1 ? c : -c;
};
Dec.prototype.add = function (other) {
  var e = Math.min(this.exp, other.exp);
  var c1 = this.coef * (10n ** BigInt(this.exp - e)) * (this.neg ? -1n : 1n);
  var c2 = other.coef * (10n ** BigInt(other.exp - e)) * (other.neg ? -1n : 1n);
  var sum = c1 + c2;
  var neg = sum < 0n;
  return new Dec(neg, neg ? -sum : sum, e);
};
Dec.prototype.sub = function (other) { return this.add(other.negated()); };
Dec.prototype.mul = function (other) {
  return new Dec(this.neg !== other.neg, this.coef * other.coef, this.exp + other.exp);
};
Dec.prototype.div = function (other) {
  if (other.isZero()) { throw new Error("Division by zero"); }
  if (this.isZero()) { return new Dec(this.neg !== other.neg, 0n, 0); }
  var neg = this.neg !== other.neg;
  var num = this.coef, den = other.coef;
  var numDigits = num.toString().length, denDigits = den.toString().length;
  var s = 29 - (numDigits - denDigits);
  var scaledNum, scaledDen, q, r;
  function attempt(shift) {
    var n = num, d = den;
    if (shift >= 0) { n = n * (10n ** BigInt(shift)); } else { d = d * (10n ** BigInt(-shift)); }
    return [n / d, n % d, n, d];
  }
  var res = attempt(s);
  q = res[0]; r = res[1];
  while (q.toString().length > 29) { s -= 1; res = attempt(s); q = res[0]; r = res[1]; }
  while (q.toString().length < 29) { s += 1; res = attempt(s); q = res[0]; r = res[1]; }
  var denUsed = res[3];
  var lastDigit = q % 10n;
  var rest = q / 10n;
  var up = false;
  if (lastDigit > 5n) { up = true; }
  else if (lastDigit === 5n) { if (r > 0n) { up = true; } else if (rest % 2n === 1n) { up = true; } }
  if (up) { rest += 1n; }
  var exp = (this.exp - other.exp) - s + 1;
  if (rest.toString().length > 28) { rest = rest / 10n; exp += 1; }
  while (rest !== 0n && rest % 10n === 0n) { rest = rest / 10n; exp += 1; }
  return new Dec(neg, rest, exp);
};
Dec.prototype.quantize = function (targetExp, halfUp) {
  var diff = this.exp - targetExp;
  if (diff === 0) { return this.clone(); }
  if (diff > 0) { return new Dec(this.neg, this.coef * (10n ** BigInt(diff)), targetExp); }
  var divisor = 10n ** BigInt(-diff);
  var q = this.coef / divisor;
  var r = this.coef % divisor;
  var twice = r * 2n;
  var up = false;
  if (halfUp) { up = twice >= divisor; }
  else { up = twice > divisor || (twice === divisor && q % 2n === 1n); }
  if (up) { q += 1n; }
  return new Dec(this.neg, q, targetExp);
};
Dec.prototype.toString = function () {
  var digits = this.coef.toString();
  var sign = this.neg ? "-" : "";
  var adjusted = this.exp + digits.length - 1;
  if (this.exp <= 0 && adjusted >= -6) {
    if (this.exp === 0) { return sign + digits; }
    var pointPos = digits.length + this.exp;
    if (pointPos > 0) { return sign + digits.slice(0, pointPos) + "." + digits.slice(pointPos); }
    return sign + "0." + "0".repeat(-pointPos) + digits;
  }
  var mantissa = digits.length > 1 ? digits.charAt(0) + "." + digits.slice(1) : digits;
  return sign + mantissa + "E" + (adjusted >= 0 ? "+" : "") + adjusted;
};
/* Python f"{amount:.2f}" for a Decimal: rounds half even to 2 places. */
function fmt2(d) {
  var q = d.quantize(-2, false);
  var digits = q.coef.toString();
  var sign = q.neg ? "-" : "";
  var pointPos = digits.length - 2;
  if (pointPos > 0) { return sign + digits.slice(0, pointPos) + "." + digits.slice(pointPos); }
  return sign + "0." + "0".repeat(-pointPos) + digits;
}

/* ---- Input handling, mirroring the Python module ---- */
function InputError(message) { this.message = message; }
InputError.prototype = Object.create(Error.prototype);

function pyRepr(v) {
  if (v === null || v === undefined) { return "None"; }
  if (v === true) { return "True"; }
  if (v === false) { return "False"; }
  if (typeof v === "string") {
    return "'" + v.replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, "\\n").replace(/\r/g, "\\r").replace(/\t/g, "\\t") + "'";
  }
  if (typeof v === "number") { return String(v); }
  if (Array.isArray(v)) { return "[" + v.map(pyRepr).join(", ") + "]"; }
  return String(v);
}
function typeName(v) {
  if (v === null || v === undefined) { return "NoneType"; }
  if (Array.isArray(v)) { return "list"; }
  if (typeof v === "object") { return "dict"; }
  if (typeof v === "boolean") { return "bool"; }
  if (typeof v === "string") { return "str"; }
  return "float";
}

function parseDecimal(value, field, label) {
  if (typeof value === "boolean") {
    throw new InputError(label + ": " + field + " must be a number, got " + pyRepr(value));
  }
  if (typeof value === "number") { return Dec.parse(String(value)); }
  if (typeof value === "string") {
    var text = value.trim();
    if (!text) { throw new InputError(label + ": " + field + " must not be empty"); }
    if (!Dec.isValidText(text)) {
      throw new InputError(label + ": " + field + " is not a valid number: " + pyRepr(value));
    }
    return Dec.parse(text);
  }
  throw new InputError(label + ": " + field + " must be a number, got " + pyRepr(value));
}

function parseState(value, label) {
  if (typeof value !== "string" || !value.trim()) {
    throw new InputError(label + ": state must be a two-letter code, got " + pyRepr(value));
  }
  var code = value.trim().toUpperCase();
  if (code.length !== 2 || !/^[A-Z]+$/.test(code)) {
    throw new InputError(label + ": state must be a two-letter code, got " + pyRepr(value));
  }
  return code;
}

function loadJsonText(text, label) {
  try { return JSON.parse(text); }
  catch (e) { throw new InputError(label + ": invalid JSON: " + e.message); }
}

function extractList(data, key, label) {
  if (Array.isArray(data)) { return data; }
  if (data !== null && typeof data === "object" && key in data) {
    if (!Array.isArray(data[key])) { throw new InputError(label + ": '" + key + "' must be a list"); }
    return data[key];
  }
  throw new InputError(label + ": JSON top level must be a list or an object with a '" + key + "' list");
}

function loadTrips(text) {
  var data = loadJsonText(text, "trips");
  var rawList = extractList(data, "trips", "trips");
  var totals = {};
  rawList.forEach(function (raw, index) {
    var label = "trip " + index;
    if (raw === null || typeof raw !== "object" || Array.isArray(raw)) {
      throw new InputError(label + ": each trip must be an object, got " + typeName(raw));
    }
    if (!("state" in raw)) { throw new InputError(label + ": missing required field 'state'"); }
    var state = parseState(raw.state, label);
    label = "trip " + state + " (entry " + index + ")";
    if (!("miles" in raw)) { throw new InputError(label + ": missing required field 'miles'"); }
    var miles = parseDecimal(raw.miles, "miles", label);
    if (miles.cmp(Dec.ZERO) < 0) {
      throw new InputError(label + ": miles must not be negative: " + pyRepr(raw.miles));
    }
    totals[state] = (totals[state] || new Dec(false, 0n, 0)).add(miles);
  });
  return totals;
}

function loadFuel(text) {
  var data = loadJsonText(text, "fuel");
  var rawList = extractList(data, "fuel", "fuel");
  var totals = {};
  rawList.forEach(function (raw, index) {
    var label = "fuel purchase " + index;
    if (raw === null || typeof raw !== "object" || Array.isArray(raw)) {
      throw new InputError(label + ": each fuel purchase must be an object, got " + typeName(raw));
    }
    if (!("state" in raw)) { throw new InputError(label + ": missing required field 'state'"); }
    var state = parseState(raw.state, label);
    label = "fuel purchase " + state + " (entry " + index + ")";
    if (!("gallons" in raw)) { throw new InputError(label + ": missing required field 'gallons'"); }
    var gallons = parseDecimal(raw.gallons, "gallons", label);
    if (gallons.cmp(Dec.ZERO) < 0) {
      throw new InputError(label + ": gallons must not be negative: " + pyRepr(raw.gallons));
    }
    totals[state] = (totals[state] || new Dec(false, 0n, 0)).add(gallons);
  });
  return totals;
}

function loadRates(text) {
  var data = loadJsonText(text, "rates");
  if (data !== null && typeof data === "object" && !Array.isArray(data) && "rates" in data) {
    data = data.rates;
  }
  var rates = {};
  if (data !== null && typeof data === "object" && !Array.isArray(data)) {
    Object.keys(data).forEach(function (stateRaw) {
      var state = parseState(stateRaw, "rates");
      var rate = parseDecimal(data[stateRaw], "rate", "rate " + state);
      if (rate.cmp(Dec.ZERO) < 0) {
        throw new InputError("rate " + state + ": rate must not be negative: " + pyRepr(data[stateRaw]));
      }
      rates[state] = rate;
    });
    return rates;
  }
  if (Array.isArray(data)) {
    data.forEach(function (raw, index) {
      var label = "rate " + index;
      if (raw === null || typeof raw !== "object" || Array.isArray(raw)) {
        throw new InputError(label + ": each rate must be an object, got " + typeName(raw));
      }
      if (!("state" in raw)) { throw new InputError(label + ": missing required field 'state'"); }
      var state = parseState(raw.state, label);
      label = "rate " + state + " (entry " + index + ")";
      if (!("rate" in raw)) { throw new InputError(label + ": missing required field 'rate'"); }
      var rate = parseDecimal(raw.rate, "rate", label);
      if (rate.cmp(Dec.ZERO) < 0) {
        throw new InputError(label + ": rate must not be negative: " + pyRepr(raw.rate));
      }
      rates[state] = rate;
    });
    return rates;
  }
  throw new InputError("rates: JSON top level must be an object mapping state codes to rates, " +
    "a list of rate objects, or an object with a 'rates' key");
}

function sumDec(list) {
  var total = new Dec(false, 0n, 0);
  list.forEach(function (d) { total = total.add(d); });
  return total;
}

function buildReturn(milesByState, gallonsByState, ratesByState, quarter) {
  var totalMiles = sumDec(Object.values(milesByState));
  var totalGallons = sumDec(Object.values(gallonsByState));
  if (totalMiles.cmp(Dec.ZERO) <= 0) { throw new InputError("cannot compute fleet MPG: total miles is 0"); }
  if (totalGallons.cmp(Dec.ZERO) <= 0) { throw new InputError("cannot compute fleet MPG: total fuel gallons is 0"); }
  var mpgExact = totalMiles.div(totalGallons);
  var mpg = mpgExact.quantize(-2, true);
  var states = {};
  var grandTotal = new Dec(false, 0n, -2);
  var grandKnown = true;
  var allStates = Array.from(new Set(Object.keys(milesByState).concat(Object.keys(gallonsByState)))).sort();
  allStates.forEach(function (state) {
    var miles = milesByState[state] || new Dec(false, 0n, 0);
    var taxPaid = gallonsByState[state] || new Dec(false, 0n, 0);
    var taxable = miles.div(mpgExact).quantize(-2, true);
    var net = taxable.sub(taxPaid);
    var rate = (state in ratesByState) ? ratesByState[state] : null;
    var taxDue;
    if (rate === null && (miles.cmp(Dec.ZERO) > 0 || taxPaid.cmp(Dec.ZERO) > 0)) {
      taxDue = null; grandKnown = false;
    } else if (rate === null) {
      taxDue = new Dec(false, 0n, -2);
    } else {
      taxDue = net.mul(rate).quantize(-2, true);
      grandTotal = grandTotal.add(taxDue);
    }
    states[state] = { miles: miles, taxable_gallons: taxable, tax_paid_gallons: taxPaid,
      net_gallons: net, rate: rate, tax_due: taxDue };
  });
  var totalTaxable = new Dec(false, 0n, -2);
  var totalNet = new Dec(false, 0n, -2);
  Object.values(states).forEach(function (e) {
    totalTaxable = totalTaxable.add(e.taxable_gallons);
    totalNet = totalNet.add(e.net_gallons);
  });
  return {
    quarter: quarter || null,
    total_miles: totalMiles,
    total_gallons: totalGallons,
    fleet_mpg: mpg,
    fleet_mpg_exact: mpgExact,
    states: states,
    total_taxable_gallons: totalTaxable,
    total_net_gallons: totalNet,
    grand_total_tax: grandKnown ? grandTotal : null,
    missing_rates: Object.keys(states).filter(function (s) {
      return states[s].rate === null && states[s].miles.cmp(Dec.ZERO) > 0;
    }).sort(),
    unaccounted_fuel_states: Object.keys(states).filter(function (s) {
      return states[s].miles.cmp(Dec.ZERO) <= 0 && states[s].tax_paid_gallons.cmp(Dec.ZERO) > 0;
    }).sort()
  };
}

function padRight(s, w) { s = String(s); while (s.length < w) { s += " "; } return s; }
function padLeft(s, w) { s = String(s); while (s.length < w) { s = " " + s; } return s; }

function formatText(result) {
  var lines = [];
  var title = "IFTA quarterly return";
  if (result.quarter) { title += " for " + result.quarter; }
  lines.push(title);
  lines.push("");
  if ("fleet_total_miles" in result) {
    lines.push("Fleet MPG: " + fmt2(result.fleet_mpg) + " (fleet-wide: " +
      fmt2(result.fleet_total_miles) + " miles / " + fmt2(result.fleet_total_gallons) + " gallons)");
  } else {
    lines.push("Fleet MPG: " + fmt2(result.fleet_mpg) + " (" +
      fmt2(result.total_miles) + " miles / " + fmt2(result.total_gallons) + " gallons)");
  }
  lines.push("Total miles: " + fmt2(result.total_miles));
  lines.push("Total fuel purchased: " + fmt2(result.total_gallons) + " gallons");
  lines.push("");
  lines.push(padRight("State", 6) + " " + padLeft("Miles", 10) + " " + padLeft("Taxable gal", 12) + " " +
    padLeft("Tax-paid gal", 13) + " " + padLeft("Net gal", 10) + " " + padLeft("Rate", 6) + " " + padLeft("Tax due", 10));
  Object.keys(result.states).sort().forEach(function (state) {
    var e = result.states[state];
    var rate = e.rate !== null ? fmt2(e.rate) : "n/a";
    var tax = e.tax_due !== null ? fmt2(e.tax_due) : "n/a";
    lines.push(padRight(state, 6) + " " + padLeft(fmt2(e.miles), 10) + " " +
      padLeft(fmt2(e.taxable_gallons), 12) + " " + padLeft(fmt2(e.tax_paid_gallons), 13) + " " +
      padLeft(fmt2(e.net_gallons), 10) + " " + padLeft(rate, 6) + " " + padLeft(tax, 10));
  });
  lines.push(padRight("Total", 6) + " " + padLeft(fmt2(result.total_miles), 10) + " " +
    padLeft(fmt2(result.total_taxable_gallons), 12) + " " + padLeft(fmt2(result.total_gallons), 13) + " " +
    padLeft(fmt2(result.total_net_gallons), 10) + " " + padLeft("", 6) + " " +
    padLeft(result.grand_total_tax !== null ? fmt2(result.grand_total_tax) : "n/a", 10));
  lines.push("");
  if (result.grand_total_tax === null) {
    var unknown = Object.keys(result.states).sort().filter(function (s) {
      return result.states[s].tax_due === null;
    }).join(", ");
    lines.push("Grand total tax due: n/a (tax unknown for: " + unknown + ")");
  } else if (result.grand_total_tax.cmp(Dec.ZERO) < 0) {
    lines.push("Grand total tax due: " + fmt2(result.grand_total_tax) +
      " (a credit of " + fmt2(result.grand_total_tax.negated()) + ")");
  } else if (result.grand_total_tax.cmp(Dec.ZERO) === 0) {
    lines.push("Grand total tax due: 0.00 (no tax owed)");
  } else {
    lines.push("Grand total tax due: " + fmt2(result.grand_total_tax));
  }
  var milesStates = Object.values(result.states).filter(function (e) { return e.miles.cmp(Dec.ZERO) > 0; }).length;
  var fuelStates = Object.values(result.states).filter(function (e) { return e.tax_paid_gallons.cmp(Dec.ZERO) > 0; }).length;
  lines.push("States: " + milesStates + " with miles, " + fuelStates + " with fuel purchases");
  return lines.join("\n") + "\n";
}

function returnToJson(result) {
  var states = {};
  Object.keys(result.states).sort().forEach(function (state) {
    var e = result.states[state];
    states[state] = {
      miles: fmt2(e.miles),
      taxable_gallons: fmt2(e.taxable_gallons),
      tax_paid_gallons: fmt2(e.tax_paid_gallons),
      net_gallons: fmt2(e.net_gallons),
      rate: e.rate !== null ? fmt2(e.rate) : null,
      tax_due: e.tax_due !== null ? fmt2(e.tax_due) : null
    };
  });
  return {
    quarter: result.quarter,
    total_miles: fmt2(result.total_miles),
    total_gallons: fmt2(result.total_gallons),
    fleet_mpg: fmt2(result.fleet_mpg),
    total_taxable_gallons: fmt2(result.total_taxable_gallons),
    total_net_gallons: fmt2(result.total_net_gallons),
    grand_total_tax: result.grand_total_tax !== null ? fmt2(result.grand_total_tax) : null,
    missing_rates: result.missing_rates,
    unaccounted_fuel_states: result.unaccounted_fuel_states,
    states: states
  };
}

function checkReasons(result) {
  var reasons = [];
  if (result.missing_rates.length) {
    reasons.push("missing rate for state(s) with miles: " + result.missing_rates.join(", "));
  }
  if (result.unaccounted_fuel_states.length) {
    reasons.push("fuel purchased in state(s) with no miles: " + result.unaccounted_fuel_states.join(", "));
  }
  return reasons;
}

window.runTool = function (inputText, options) {
  options = options || {};
  var result;
  try {
    var milesByState = loadTrips(inputText || "");
    var gallonsByState = loadFuel(options.fuelText || "");
    var ratesByState = loadRates(options.ratesText || "");
    result = buildReturn(milesByState, gallonsByState, ratesByState, options.quarter || null);
  } catch (e) {
    if (e instanceof InputError) { return "error: " + e.message + "\n"; }
    throw e;
  }
  var display = result;
  var stateFilter = (options.state || "").trim();
  if (stateFilter) {
    var code;
    try { code = parseState(stateFilter, "--state"); }
    catch (e) { return "error: " + e.message + "\n"; }
    display = Object.assign({}, result);
    if (!(code in result.states)) {
      display.states = {};
      display.total_miles = new Dec(false, 0n, -2);
      display.total_gallons = new Dec(false, 0n, -2);
      display.total_taxable_gallons = new Dec(false, 0n, -2);
      display.total_net_gallons = new Dec(false, 0n, -2);
      display.grand_total_tax = new Dec(false, 0n, -2);
      display.missing_rates = [];
      display.unaccounted_fuel_states = [];
    } else {
      var entry = result.states[code];
      var single = {};
      single[code] = entry;
      display.states = single;
      display.fleet_total_miles = result.total_miles;
      display.fleet_total_gallons = result.total_gallons;
      display.total_miles = entry.miles;
      display.total_gallons = entry.tax_paid_gallons;
      display.total_taxable_gallons = entry.taxable_gallons;
      display.total_net_gallons = entry.net_gallons;
      display.grand_total_tax = entry.tax_due;
      display.missing_rates = (entry.rate === null && entry.miles.cmp(Dec.ZERO) > 0) ? [code] : [];
      display.unaccounted_fuel_states =
        (entry.miles.cmp(Dec.ZERO) <= 0 && entry.tax_paid_gallons.cmp(Dec.ZERO) > 0) ? [code] : [];
    }
  }
  var out;
  if (options.json) {
    out = JSON.stringify(returnToJson(display), null, 2) + "\n";
  } else {
    out = formatText(display);
    if (options.check) {
      var reasons = checkReasons(result);
      if (reasons.length) { out += "CHECK FAILED: " + reasons.join("; ") + "\n"; }
      else { out += "CHECK PASSED: all states with miles have rates, no fuel in states with no miles\n"; }
    }
  }
  return out;
};
</script>

<script>
"use strict";
var SAMPLE_TRIPS = `[{"miles":2400,"state":"TX"},{"miles":1200,"state":"OK"},{"miles":600,"state":"NM"},{"miles":600,"state":"AZ"}]`;
var SAMPLE_FUEL = `[{"gallons":280,"state":"TX"},{"gallons":170,"state":"OK"},{"gallons":60,"state":"NM"},{"gallons":90,"state":"AZ"}]`;
var SAMPLE_RATES = `{"AZ":0.26,"NM":0.21,"OK":0.19,"TX":0.2}`;
var inputEl = document.getElementById("input");
var fuelEl = document.getElementById("fuel");
var ratesEl = document.getElementById("rates");
var outputEl = document.getElementById("output");
document.getElementById("file").addEventListener("change", function (ev) {
  var f = ev.target.files[0];
  if (!f) { return; }
  var reader = new FileReader();
  reader.onload = function () { inputEl.value = String(reader.result); };
  reader.readAsText(f);
});
function loadSample() {
  inputEl.value = SAMPLE_TRIPS;
  fuelEl.value = SAMPLE_FUEL;
  ratesEl.value = SAMPLE_RATES;
}
document.getElementById("sample").addEventListener("click", loadSample);
document.getElementById("run").addEventListener("click", function () {
  var report = window.runTool(inputEl.value, {
    fuelText: fuelEl.value,
    ratesText: ratesEl.value,
    quarter: document.getElementById("quarter").value || "",
    state: document.getElementById("state").value || "",
    check: document.getElementById("check").checked,
    json: document.getElementById("json").checked
  });
  outputEl.textContent = report.replace(/\n$/, "");
});
document.getElementById("download").addEventListener("click", function () {
  var blob = new Blob([outputEl.textContent + "\n"], { type: "text/plain" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ifta-mileage-doctor-report.txt";
  a.click();
  URL.revokeObjectURL(a.href);
});
loadSample();
</script>
